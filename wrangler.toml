name = "www"
main = "server/worker.js"
compatibility_date = "2026-05-18"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Contact form: at most 3 messages per minute per IP (Workers rate-limiting binding, read in server/contactEmail.js).
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

[[d1_databases]]
binding = "VISITS_DB"
database_name = "portfolio-visits"
database_id = "ea578ed1-b495-459a-b60d-24cc8e543a25"
migrations_dir = "migrations"

[[ratelimits]]
name = "VISITS_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 20
  period = 60
