<!doctype html>
<!-- Source of public/og-image.png (1200×630): open it at that size and take a screenshot. -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: Inter;
        src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 34px;
        padding: 0 84px;
        font-family: Inter, sans-serif;
        color: #e4e4e7;
        background: #05070a radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1.5px) 0 0 / 28px 28px;
      }
      h1 { font-size: 112px; line-height: 1; font-weight: 700; letter-spacing: -0.025em; text-transform: uppercase; color: #fff; }
      h1 span { color: #4ade80; }
      .jobs { font-size: 42px; font-weight: 700; letter-spacing: -0.015em; text-transform: uppercase; }
      .ai { color: #38bdf8; }
      .threat { color: #f43f5e; }
      .dot { color: #52525b; }
      .pitch { max-width: 900px; border-left: 3px solid #4ade80; padding-left: 26px; font-size: 32px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <h1>Nagi <span>Jérémie</span></h1>
    <p class="jobs"><span class="ai">Développeur IA</span><span class="dot"> · </span><span class="threat">Pentester junior</span></p>
    <p class="pitch">Je développe des solutions IA et identifie les vulnérabilités des systèmes pour mieux les sécuriser.</p>
  </body>
</html>
